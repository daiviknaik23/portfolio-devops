# =============================================================
# Full-Stack Docker Compose
# Portfolio App + Monitoring (Prometheus, Grafana, Exporters)
# =============================================================
#
# Usage:
#   docker-compose up -d
#
# This brings up:
#   - Portfolio website on port 80
#   - Prometheus on port 9090
#   - Grafana on port 3000
#   - Nginx Exporter on port 9113
#   - Node Exporter on port 9100
#
# =============================================================

networks:
  portfolio-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:
  # ─── Portfolio Website ───────────────────────────────────────
  portfolio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "app=portfolio"
      - "component=frontend"

  # ─── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: portfolio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./devops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./devops/monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      portfolio-app:
        condition: service_healthy
    networks:
      - portfolio-network
    labels:
      - "app=portfolio"
      - "component=prometheus"

  # ─── Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: portfolio-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./devops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./devops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./devops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - portfolio-network
    labels:
      - "app=portfolio"
      - "component=grafana"

  # ─── Nginx Prometheus Exporter ───────────────────────────────
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: portfolio-nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - "-nginx.scrape-uri=http://portfolio-app:80/nginx_status"
    depends_on:
      portfolio-app:
        condition: service_healthy
    networks:
      - portfolio-network
    labels:
      - "app=portfolio"
      - "component=nginx-exporter"

  # ─── Node Exporter (Host Metrics) ───────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: portfolio-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - portfolio-network
    labels:
      - "app=portfolio"
      - "component=node-exporter"
